<h2 mat-dialog-title>Change Password</h2>
<p class="subtitle">You must set a new password before continuing.</p>

<div mat-dialog-content>
  @if (validationError || (error$ | async); as displayError) {
    <div class="error-alert">{{ displayError }}</div>
  }

  <form [formGroup]="form" (change)="onFieldChange()">
    <div class="field-row">
      <app-password-input
        formControlName="currentPassword"
        label="Current Password"
        placeholder="Enter your current password"
      ></app-password-input>
    </div>
    <div class="field-row">
      <app-password-input
        formControlName="newPassword"
        label="New Password"
        placeholder="Enter new password"
      ></app-password-input>
    </div>
    <div class="field-row">
      <app-password-input
        formControlName="confirmPassword"
        label="Confirm Password"
        placeholder="Confirm new password"
      ></app-password-input>
    </div>
  </form>
</div>

<div mat-dialog-actions>
  <button mat-button [disabled]="forced" (click)="handleClose()">Cancel</button>
  <button mat-flat-button color="primary" [disabled]="!isSaveEnabled" (click)="handleSave()">
    Save Password
  </button>
</div>
