<div class="drawer-header">
  <h2>Filter Tasks</h2>
  <div class="header-actions">
    @if (hasActiveFilters) {
      <button mat-button class="reset-btn" (click)="handleReset()">Reset Filters</button>
    }
    <button mat-icon-button (click)="handleClose()">
      <mat-icon>close</mat-icon>
    </button>
  </div>
</div>

<p class="section-label">Status</p>
<div class="checkbox-group">
  @for (status of statuses; track status) {
    <label class="checkbox-row">
      <mat-checkbox
        [checked]="draft.status.includes(status)"
        (change)="toggleStatus(status)"
      ></mat-checkbox>
      <span
        class="chip"
        [style.background-color]="statusColors[status].bg + '18'"
        [style.color]="statusColors[status].color"
      >
        {{ status }}
      </span>
    </label>
  }
</div>

<div class="divider"></div>

<p class="section-label">Priority</p>
<div class="checkbox-group">
  @for (priority of priorities; track priority) {
    <label class="checkbox-row">
      <mat-checkbox
        [checked]="draft.priority.includes(priority)"
        (change)="togglePriority(priority)"
      ></mat-checkbox>
      <span
        class="chip"
        [style.background-color]="priorityColors[priority].bg + '18'"
        [style.color]="priorityColors[priority].color"
      >
        {{ priority }}
      </span>
    </label>
  }
</div>

<div class="divider"></div>

<p class="section-label">Due Date Range</p>
<div class="date-range">
  <div>
    <p class="date-label">From</p>
    <mat-form-field appearance="outline" class="text-field">
      <input
        matInput
        [matDatepicker]="fromPicker"
        [value]="dueDateFromValue"
        placeholder="Select date"
        (dateChange)="setDueDateFrom($event.value)"
      />
      <mat-datepicker-toggle matSuffix [for]="fromPicker"></mat-datepicker-toggle>
      <mat-datepicker #fromPicker></mat-datepicker>
    </mat-form-field>
  </div>
  <div>
    <p class="date-label">To</p>
    <mat-form-field appearance="outline" class="text-field">
      <input
        matInput
        [matDatepicker]="toPicker"
        [value]="dueDateToValue"
        placeholder="Select date"
        (dateChange)="setDueDateTo($event.value)"
      />
      <mat-datepicker-toggle matSuffix [for]="toPicker"></mat-datepicker-toggle>
      <mat-datepicker #toPicker></mat-datepicker>
    </mat-form-field>
  </div>
</div>

<div class="divider"></div>

<p class="section-label">Title</p>
<mat-form-field appearance="outline" class="text-field title-field">
  <input
    matInput
    placeholder="Search by title…"
    [value]="draft.titleSearch ?? ''"
    (input)="setTitleSearch($any($event.target).value)"
  />
  @if (!titleSearchValid) {
    <mat-error>Enter at least 3 characters</mat-error>
  }
</mat-form-field>

<button
  mat-flat-button
  color="primary"
  class="apply-btn"
  [disabled]="!draftIsDirty || !titleSearchValid"
  (click)="handleApply()"
>
  Apply Filters
</button>
