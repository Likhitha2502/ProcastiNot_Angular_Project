<div class="page-wrapper">
  <div class="card">
    <div class="logo-container">
      <img src="logo.svg" alt="ProcrastiNot" class="logo-image" />
    </div>

    <div class="header-container">
      <p class="header-accent">{{ headerText }}</p>
      <div class="divider"></div>
    </div>

    @switch (view()) {
      @case ('login') {
        <app-login-form (signUpClick)="showSignUp()" (forgotClick)="showForgot()"></app-login-form>
      }
      @case ('signup') {
        <app-signup-form (backToLogin)="showLogin()"></app-signup-form>
      }
      @case ('forgot') {
        <app-forgot-password-form (backToLogin)="showLogin()"></app-forgot-password-form>
      }
    }

    <p class="footer-caption">Only you can see your tasks. No shared access.</p>
  </div>
</div>
