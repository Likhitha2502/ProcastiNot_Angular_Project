<form [formGroup]="form" (ngSubmit)="onSendEmail()" (change)="onFieldChange()" class="forgot-form">
  @if (error$ | async; as error) {
    <p class="error-text">{{ error }}</p>
  }

  <div class="email-section">
    <label class="field-label">Email</label>
    <mat-form-field appearance="outline" class="text-field">
      <input matInput type="email" formControlName="email" placeholder="Enter email address" />
    </mat-form-field>
    <p class="helper-text">
      Enter the email address associated with your account to receive a temporary password.
    </p>
  </div>

  <button mat-flat-button color="primary" class="primary-button" type="submit">Send Email</button>

  <button mat-button class="secondary-button" type="button" (click)="backToLogin.emit()">
    Back to Sign In
  </button>
</form>
